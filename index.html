<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Water Quest</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <div class="logo-crop">
      <img src="https://images.seeklogo.com/logo-png/61/2/charity-water-logo-png_seeklogo-618081.png" alt="Charity Water Logo" class="logo">
    </div>
    <h1>Water Quest</h1>
    <p class="game-instructions">Collect 20 items to complete the game!</p>
    <div class="stats">
      <p>Cans Collected: <span id="current-cans">0</span></p>
      <p>Time Left: <span id="timer">30</span>s</p>
    </div>
    <div id="achievements" class="achievement"></div>
    <div class="game-grid">
      <button class="water-can">Can</button>
    </div>
    <div class="difficulty-selector">
      <button class="difficulty" data-difficulty="easy">Easy</button>
      <button class="difficulty active" data-difficulty="medium">Medium</button>
      <button class="difficulty" data-difficulty="hard">Hard</button>
    </div>
    <button id="start-game">Start Game</button>
  </div>
  <script src="script.js"></script>
  <footer>
    <div class="footer-buttons">
      <a class="footer-button" href="https://www.charitywater.org/donate">Donate to Charity Water</a>
      <a class="footer-button" href="https://www.charitywater.org/">Visit the Charity Water Website</a>
    </div>
  </footer>
</body>
</html>
